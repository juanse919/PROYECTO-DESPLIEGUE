[tox]
envlist = test_app
skipsdist = True

[testenv]
install_command = pip install {opts} {packages}

[testenv:test_app]
deps =
    -r requirements.txt
    pytest>=8.0,<10.0
    httpx>=0.27,<1.0
setenv =
    PYTHONPATH = .
    PYTHONHASHSEED = 0
commands = pytest -vv app/tests/

[testenv:run]
envdir = {toxworkdir}/test_app
deps = {[testenv:test_app]deps}
setenv = {[testenv:test_app]setenv}
commands = python app/main.py