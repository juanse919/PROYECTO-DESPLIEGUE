[tox]
envlist = test_package
skipsdist = True

[testenv]
install_command = pip install {opts} {packages}
setenv =
    PYTHONPATH = .
    PYTHONHASHSEED = 0
passenv =
    RUTA_DATOS
    MLFLOW_TRACKING_URI

[testenv:train]
deps =
    -r requirements/requirements.txt
    pyreadstat>=1.2,<2.0
    mlflow>=2.14,<4.0
commands = python modelo_ingreso/train_pipeline.py

[testenv:test_package]
deps =
    -r requirements/requirements.txt
    pytest>=8.0,<10.0
commands = pytest -s -vv tests/